name: AHA isolated schema and synthetic restore gate
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'mobile_app/**'
      - 'ci/**'
      - 'scripts/security/**'
      - 'tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'mobile_app/**'
      - 'ci/**'
      - 'scripts/security/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  schema-restore:
    name: Isolated migration and synthetic restore (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        service: [auth, reminder, notification]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: aha_ci
          POSTGRES_PASSWORD: ci-only-postgres-password-not-production
          POSTGRES_DB: aha_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aha_ci -d aha_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: backend/${{ matrix.service }}-service/package-lock.json
      - name: Migrate synthetic database, dump, restore, and verify
        env:
          GITHUB_ACTIONS: "true"
          AHA_ISOLATED_DB_TEST: "true"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
        run: bash ci/schema-synthetic-restore.sh "${{ matrix.service }}"
