name: AHA isolated Auth-Reminder HTTP IDOR and RBAC
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'mobile_app/**'
      - 'ci/**'
      - 'scripts/security/**'
      - 'tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'mobile_app/**'
      - 'ci/**'
      - 'scripts/security/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  family-idor:
    name: Real HTTP + isolated PostgreSQL IDOR checks
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: aha_ci
          POSTGRES_PASSWORD: ci-only-postgres-password-not-production
          POSTGRES_DB: aha_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aha_ci -d aha_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
      - name: Prepare two isolated PostgreSQL databases
        run: |
          set -euo pipefail
          export PGPASSWORD=ci-only-postgres-password-not-production
          for db in aha_auth_ci aha_reminder_ci; do
            docker run --rm --network host -e PGPASSWORD postgres:18-alpine \
              psql -h 127.0.0.1 -U aha_ci -d aha_ci -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db"
          done
      - name: Install and migrate Auth/Reminder schemas without production secrets
        env:
          NODE_ENV: test
        run: |
          set -euo pipefail
          npm --prefix backend/auth-service ci --ignore-scripts --no-audit --no-fund
          npm --prefix backend/reminder-service ci --ignore-scripts --no-audit --no-fund
          DATABASE_URL=postgresql://aha_ci:ci-only-postgres-password-not-production@127.0.0.1:5432/aha_auth_ci npm --prefix backend/auth-service run migrate
          DATABASE_URL=postgresql://aha_ci:ci-only-postgres-password-not-production@127.0.0.1:5432/aha_reminder_ci npm --prefix backend/reminder-service run migrate
      - name: Exercise two synthetic families over actual HTTP
        env:
          GITHUB_ACTIONS: "true"
          AHA_ISOLATED_DB_TEST: "true"
          AUTH_FIXTURE_DB_URL: postgresql://aha_ci:ci-only-postgres-password-not-production@127.0.0.1:5432/aha_auth_ci
          REMINDER_FIXTURE_DB_URL: postgresql://aha_ci:ci-only-postgres-password-not-production@127.0.0.1:5432/aha_reminder_ci
        run: node ci/isolated-family-idor.cjs
